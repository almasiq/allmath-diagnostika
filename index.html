<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>allΣath Диагностика</title>
<meta name="description" content="Адаптивная диагностика пробелов по математике для 4 и 11 класса, отчёт по разделам и темам">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one calm column (max 760px) under a navy brand band; three screens — start, question, report */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#0F1B3D; --muted:#56607A; --line:#DDE2EE;
  --brand:#0F1B3D; --on-brand:#FFFFFF; --on-brand-muted:#B9C3DD;
  --accent:#2F5BD3; --accent-ink:#FFFFFF; --accent-soft:#E6EDFD;
  --gold:#E8A33D; --gold-ink:#0F1B3D;
  --gap-fg:#B4471A; --gap-bg:#FBE4D6;
  --warn-fg:#865708; --warn-bg:#FBEFD4;
  --ok-fg:#1F48B8; --ok-bg:#E2EAFD;
  --as-fg:#3F5590; --as-bg:#EFF2F9;
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --okd-bg:#3E9467; --okd-fg:#2B7A52; --okl-bg:#CBEBD9;
  --gapl-bg:#FBE9C6; --root-bg:#F0A94A; --root-ink:#2A1505; --root-fg:#B65A12; --root-line:#F1C98C; --root-card:#FFF8EC;
  --hero-bg:#0B1636; --hero-fg:#FFFFFF; --hero-muted:#B9C3DD; --hero-eyebrow:#8FA8F5; --hero-tile:#16244F;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1230; --surface:#121D40; --ink:#E8ECF7; --muted:#A3ADC6; --line:#25335C;
  --brand:#16224A; --on-brand:#FFFFFF; --on-brand-muted:#AEB8D4;
  --accent:#6E95F0; --accent-ink:#0A1230; --accent-soft:#1B2B5A;
  --gold:#F0B654; --gold-ink:#0A1230;
  --gap-fg:#F39A6C; --gap-bg:#3A2216;
  --warn-fg:#F2C26E; --warn-bg:#382B12;
  --ok-fg:#A9C1F7; --ok-bg:#1A2B5C;
  --as-fg:#B9C5E6; --as-bg:#1A2549;
  --okd-bg:#3E9467; --okd-fg:#7FD3A6; --okl-bg:#1F4635;
  --gapl-bg:#3A2E14; --root-bg:#E59A3A; --root-ink:#1E0F02; --root-fg:#F2B266; --root-line:#7A5520; --root-card:#2A200F;
  --hero-bg:#060D24; --hero-fg:#FFFFFF; --hero-muted:#AEB8D4; --hero-eyebrow:#8FA8F5; --hero-tile:#16244F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1230; --surface:#121D40; --ink:#E8ECF7; --muted:#A3ADC6; --line:#25335C;
  --brand:#16224A; --on-brand:#FFFFFF; --on-brand-muted:#AEB8D4;
  --accent:#6E95F0; --accent-ink:#0A1230; --accent-soft:#1B2B5A;
  --gold:#F0B654; --gold-ink:#0A1230;
  --gap-fg:#F39A6C; --gap-bg:#3A2216;
  --warn-fg:#F2C26E; --warn-bg:#382B12;
  --ok-fg:#A9C1F7; --ok-bg:#1A2B5C;
  --as-fg:#B9C5E6; --as-bg:#1A2549;
  --okd-bg:#3E9467; --okd-fg:#7FD3A6; --okl-bg:#1F4635;
  --gapl-bg:#3A2E14; --root-bg:#E59A3A; --root-ink:#1E0F02; --root-fg:#F2B266; --root-line:#7A5520; --root-card:#2A200F;
  --hero-bg:#060D24; --hero-fg:#FFFFFF; --hero-muted:#AEB8D4; --hero-eyebrow:#8FA8F5; --hero-tile:#16244F;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;margin:0}
.band{background:var(--brand);color:var(--on-brand);padding-inline:16px}
.band-in{max-width:1240px;margin:0 auto;padding-block:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.2px}
.band small{color:var(--on-brand-muted);font-size:13px;font-weight:600}
main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.2}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:800}
p{margin:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:800;font-size:16px;border-radius:12px;min-height:48px;padding:0 20px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
input[type=text]{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
.gradepick{display:inline-flex;align-items:center;gap:8px;min-height:48px;min-width:64px;padding:0 14px;border:2px solid var(--line);border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;background:var(--surface)}
.gradepick:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.gradepick input{width:18px;height:18px;accent-color:var(--accent)}
.fullpick{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.fullpick input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.map div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px;font-weight:600}
.map b{font-variant-numeric:tabular-nums;color:var(--muted)}
/* question */
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:clamp(19px,3.4vw,23px);font-weight:700;line-height:1.45}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.opt{font:inherit;text-align:left;font-size:18px;font-weight:600;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;display:flex;gap:12px;align-items:center;cursor:pointer}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 2px}
.fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
sup,sub{font-size:.7em;line-height:0}
/* report */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--font-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;font-weight:700}
.t-gap{background:var(--gap-bg);color:var(--gap-fg)} .t-warn{background:var(--warn-bg);color:var(--warn-fg)} .t-ok{background:var(--ok-bg);color:var(--ok-fg)} .t-n{background:var(--as-bg);color:var(--as-fg)}
.chip{flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
.c-gap{background:var(--gap-bg);color:var(--gap-fg)} .c-unstable{background:var(--warn-bg);color:var(--warn-fg)} .c-mastered{background:var(--ok-bg);color:var(--ok-fg)} .c-assumed{background:var(--as-bg);color:var(--as-fg)}
.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);gap:2px}
.seg i{display:block;height:100%}
.s-gap{background:var(--gap-fg)} .s-unstable{background:var(--gold)} .s-mastered{background:var(--accent)} .s-assumed{background:var(--as-fg);opacity:.45}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.trow:first-of-type{border-top:0}
.trow .g{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.plan{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.plan li{padding-left:4px}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700;list-style-position:inside}
.sol{margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
textarea.copyfall{width:100%;min-height:140px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}

main.wide{max-width:1240px}
.rhead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.rtitle{font-family:var(--font-body);font-weight:800;font-size:clamp(24px,4vw,30px)}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px}
.toprow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:18px;padding:22px;display:flex;gap:18px;align-items:center}
.hero h2{font-size:clamp(19px,2.6vw,24px);line-height:1.3;color:var(--hero-fg)}
.hero p{color:var(--hero-muted);font-size:15px}
.owlwrap{flex:none;width:84px;height:84px;border-radius:20px;background:var(--hero-tile);display:flex;align-items:center;justify-content:center}
.owl{width:66px;height:66px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--font-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi small{font-size:12px;color:var(--muted)}
.tbad{color:var(--root-fg)}
.mainrow{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.legend .lg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.mapscroll{overflow-x:auto;margin:0 -4px;padding:2px 4px}
.map2{display:flex;flex-direction:column;gap:4px;min-width:calc(150px + var(--cols) * 44px + 90px)}
.mrow{display:grid;grid-template-columns:minmax(130px,1.4fr) repeat(var(--cols),minmax(36px,1fr)) minmax(80px,auto);gap:5px;align-items:center;padding:4px 6px;border-radius:10px;border:1.5px solid transparent;background:transparent;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.mrow:hover{background:var(--bg)}
.mrow.sel{border-color:var(--accent);background:var(--accent-soft)}
.mhead{cursor:default;font-size:12px;color:var(--muted);font-weight:700}
.mhead:hover{background:transparent}
.mname{font-size:14px;font-weight:700;line-height:1.25;min-width:0}
.mhead .mname{font-weight:700}
.mg{text-align:center}
.msum{font-size:12px;font-weight:800;text-align:right;white-space:nowrap}
.s-ok{color:var(--okd-fg)} .s-bad{color:var(--root-fg)} .s-warn{color:var(--warn-fg)}
.cell{position:relative;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1}
.cell i{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:9px;opacity:.75}
.cell.sm{width:30px;flex:none}
.cell.xs{width:20px;height:20px;font-size:12px;border-radius:5px}
.k-none{border:1.5px dashed var(--line)}
.k-mastered{background:var(--okd-bg);color:#FFFFFF}
.k-assumed{background:var(--okl-bg)}
.k-unstable{background:var(--warn-bg);color:var(--warn-fg)}
.k-gap{background:var(--gapl-bg);color:var(--root-fg)}
.k-root{background:var(--root-bg);color:var(--root-ink);box-shadow:inset 0 0 0 2px var(--root-fg)}
.tlist{display:flex;flex-direction:column;gap:6px}
.titem{display:flex;gap:12px;align-items:flex-start;padding:8px;border-radius:10px}
.titem b{display:block;font-size:14px;line-height:1.35}
.titem .muted{font-size:12px}
.k-root-row{background:var(--gapl-bg)}
.rootcard{border:1.5px solid var(--root-line);background:var(--root-card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rootcard h3{font-size:15px}
.rootcard p{font-size:14px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.week{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:14px}
.week ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
@media (max-width: 900px){.toprow,.mainrow{grid-template-columns:minmax(0,1fr)}}
@media (max-width: 520px){.hero{flex-direction:column;align-items:flex-start}.owlwrap{width:64px;height:64px}.owl{width:52px;height:52px}}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>

<header class="band"><div class="band-in"><span class="logo">allΣath</span><small id="bandnote">Диагностика по математике</small></div></header>
<main id="app"></main>

<script>
(function(){
"use strict";
var WHATSAPP = "77081995718";      // номер для отправки результатов
var STORE_KEY = "allmath-diag-v2";
var F = function(a,b){ return '<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>'; };

var SECTIONS = [
 {id:"num",  name:"Числа и вычисления"},
 {id:"frac", name:"Дроби"},
 {id:"perc", name:"Проценты и пропорции"},
 {id:"word", name:"Текстовые задачи"},
 {id:"expr", name:"Выражения, степени, корни"},
 {id:"eq",   name:"Уравнения и системы"},
 {id:"ineq", name:"Неравенства"},
 {id:"fun",  name:"Функции и графики"},
 {id:"seq",  name:"Последовательности"},
 {id:"trig", name:"Тригонометрия"},
 {id:"log",  name:"Показательная функция и логарифмы"},
 {id:"calc", name:"Производная и интеграл"},
 {id:"prob", name:"Множества, статистика, вероятность"},
 {id:"plan", name:"Геометрия на плоскости"},
 {id:"st",   name:"Геометрия в пространстве"}
];

// Каждая тема: 2 задачи. В вариантах первый — верный (порядок перемешивается).
// r — темы, без которых задачу этой темы не решить (их засчитываем, если тема решена).
var T = [
 // ---------- Числа
 // ---------- 4 класс (Акпаева А.Б.)
 {id:"n4_num",s:"num",n:"Многозначные числа, округление",g:4,r:[],q:[
  ["Округлите число 4 563 728 до тысяч.",["4 564 000","4 563 000","4 560 000","4 600 000"],"Смотрим на цифру сотен: 7 ≥ 5, поэтому тысячи увеличиваем на 1: 4 564 000."],
  ["Сколько всего тысяч в числе 3 405 200?",["3 405","405","3","34 052"],"Отбрасываем три последние цифры: 3 405 тысяч."]]},
 {id:"n4_add",s:"num",n:"Письменное сложение и вычитание",g:4,r:["n4_num"],q:[
  ["Вычислите: 70 003 − 28 457",["41 546","42 546","41 656","58 456"],"Вычитаем столбиком с займами: 70 003 − 28 457 = 41 546. Проверка: 41 546 + 28 457 = 70 003."],
  ["Вычислите: 386 095 + 47 908",["434 003","433 003","434 993","424 003"],"Складываем столбиком: 386 095 + 47 908 = 434 003."]]},
 {id:"n4_mul",s:"num",n:"Умножение и деление многозначных чисел",g:4,r:[],q:[
  ["Вычислите: 2 408 · 35",["84 280","84 380","19 264","8 428"],"2 408 · 30 = 72 240; 2 408 · 5 = 12 040; вместе 84 280."],
  ["Вычислите: 25 704 : 84",["306","36","360","3 006"],"257 : 84 = 3 (ост. 5), сносим 0: 50 : 84 = 0, сносим 4: 504 : 84 = 6. Ответ 306."]]},
 {id:"n4_order",s:"num",n:"Порядок действий в выражениях",g:4,r:["n4_mul","n4_add"],q:[
  ["Вычислите: 900 − 120 : 4 · 3 + 15",["825","905","795","600"],"Сначала деление и умножение слева направо: 120 : 4 = 30, 30 · 3 = 90. Затем 900 − 90 + 15 = 825."],
  ["Вычислите: (5 600 − 2 400) : 80 + 60 · 5",["340","500","304","640"],"Скобки: 3 200; 3 200 : 80 = 40; 60 · 5 = 300; 40 + 300 = 340."]]},
 {id:"n4_units",s:"num",n:"Величины: длина, масса, площадь, время",g:4,r:["n4_mul"],q:[
  ["Сколько квадратных метров в 3 гектарах?",["30 000 м²","3 000 м²","300 м²","300 000 м²"],"1 га = 10 000 м², значит 3 га = 30 000 м²."],
  ["Поезд отправился в 21:45 и был в пути 3 ч 40 мин. Во сколько он прибыл?",["01:25","00:25","01:05","02:25"],"21:45 + 3 ч = 00:45; 00:45 + 40 мин = 01:25."]]},
 {id:"n4_frac",s:"frac",n:"Доли и дроби: часть от числа, число по его части",g:4,r:["n4_mul"],q:[
  ["Найдите "+F(3,8)+" от 240.",["90","640","30","80"],"240 : 8 = 30 — одна восьмая; 30 · 3 = 90."],
  [F(2,5)+" всех учеников класса — это 12 человек. Сколько всего учеников в классе?",["30","24","60","20"],"12 : 2 = 6 — одна пятая; 6 · 5 = 30."]]},
 {id:"n4_motion",s:"word",n:"Задачи на движение",g:4,r:["n4_mul"],q:[
  ["Расстояние между городами 540 км. Из них одновременно навстречу друг другу выехали два автомобиля со скоростями 70 км/ч и 65 км/ч. Через сколько часов они встретятся?",["4","8","5","3"],"Скорость сближения 70 + 65 = 135 км/ч; 540 : 135 = 4 ч."],
  ["Велосипедист выехал со скоростью 12 км/ч. Через 2 часа из той же точки за ним выехал мотоциклист со скоростью 36 км/ч. Через сколько часов после выезда мотоциклист догонит велосипедиста?",["1","2","3","6"],"За 2 ч велосипедист проехал 24 км. Скорость сближения 36 − 12 = 24 км/ч; 24 : 24 = 1 ч."]]},
 {id:"n4_work",s:"word",n:"Задачи на работу и производительность",g:4,r:["n4_mul","n4_frac"],q:[

var byId = {}; T.forEach(function(t,i){ t.i=i; byId[t.id]=t; });
var secIndex = {}; SECTIONS.forEach(function(s,i){ secIndex[s.id]=i; });
var GRADE_LIST = [4,5,6,7,8,9,10,11];
var selGrade = 11, selFull = false;
function lead(g){ return g===4 ? "Найдём пробелы по темам 4 класса" : "Найдём пробелы по всем темам с 4 по "+g+" класс"; }
function nextText(g){ return g===11 ? "Пробелов не найдено. Следующий шаг — задачи повышенной сложности и пробники ЕНТ." : "Пробелов не найдено. Можно браться за темы "+(g+1)+" класса."; }
function rootsOf(A){ var req={}; A.forEach(function(t){ t.r.forEach(function(p){ req[p]=true; }); }); return A.filter(function(t){return !req[t.id];}); }
function estimate(g,full){
  var A=act(g), lo=full?A.length:rootsOf(A).length, hi=full?A.length*2:A.length;
  return "Обычно "+lo+"–"+hi+" вопросов, примерно "+Math.max(10,Math.round(lo*1.1))+"–"+Math.round(hi*1.3)+" минут.";
}
function act(g){ return T.filter(function(t){ return t.g<=g; }); }

var LABEL = {gap:"Пробел", unstable:"Нестабильно", mastered:"Освоено", assumed:"Засчитано"};
var app = document.getElementById("app");
var S = null;

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function strip(h){ var d=document.createElement("div"); d.innerHTML=h; return d.textContent.replace(/\s+/g," ").trim(); }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ var v=localStorage.getItem(STORE_KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
function clear(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
function shuffle(n){ var a=[]; for(var i=0;i<n;i++)a.push(i); for(var j=n-1;j>0;j--){ var k=Math.floor(Math.random()*(j+1)); var x=a[j]; a[j]=a[k]; a[k]=x; } return a; }
function fmtTime(ms){ var m=Math.round(ms/60000); return m<1?"меньше минуты":m+" мин"; }

function newState(name,grade,full){
  var A=act(grade);
  return { name:name, grade:grade, full:!!full, status:{}, queue:(full?A:rootsOf(A)).map(function(t){return t.id;}),
           cur:null, answers:[], started:Date.now(), finished:null };
}
function assume(id){
  if(S.full) return;
  byId[id].r.forEach(function(p){ if(!S.status[p]){ S.status[p]="assumed"; assume(p); } });
}
function nextTopic(){
  S.queue.sort(function(a,b){ var A=byId[a],B=byId[b];
    return (secIndex[A.s]-secIndex[B.s]) || (B.g-A.g) || (A.i-B.i); });
  while(S.queue.length){
    var id=S.queue.shift(), st=S.status[id];
    if(!st || st==="assumed"){ delete S.status[id]; return id; }
  }
  return null;
}
function ask(id,qi){ S.cur={id:id, qi:qi, order:shuffle(4), t:Date.now()}; save(); render(); }
function advance(){
  var id=nextTopic();
  if(id){ ask(id,0); return; }
  act(S.grade).forEach(function(t){ if(!S.status[t.id]) S.status[t.id]="assumed"; });
  S.cur=null; S.finished=Date.now(); save(); render();
}
function answer(choice){ // choice: index of original option, or -1 for "не знаю"
  var c=S.cur, t=byId[c.id], ok=choice===0;
  S.answers.push({id:c.id, qi:c.qi, choice:choice, ok:ok, ms:Date.now()-c.t});
  if(ok){
    S.status[c.id] = c.qi===0 ? "mastered" : "unstable";
    assume(c.id); advance(); return;
  }
  if(c.qi===0 && choice!==-1){ ask(c.id,1); return; }
  S.status[c.id]="gap";
  t.r.forEach(function(p){ if(!S.status[p] || S.status[p]==="assumed"){ delete S.status[p]; S.queue.push(p); } });
  advance();
}

// ---------- screens
function render(){
  app.className="";
  document.getElementById("bandnote").textContent = S ? "Диагностика · "+S.grade+" класс" : "Диагностика по математике";
  if(!S) return renderStart();
  if(S.cur) return renderQuestion();
  return renderReport();
}

function renderStart(){
  var saved=load();
  var A=act(selGrade);
  var resume = saved && !saved.finished && saved.cur ?
    '<div class="panel row" style="justify-content:space-between"><div><h3>Есть незавершённая диагностика</h3><p class="muted">'+esc(saved.name)+' · '+saved.grade+' класс · отвечено '+saved.answers.length+'</p></div><button class="btn btn-gold" id="resume">Продолжить</button></div>' : '';
  var lastReport = saved && saved.finished ? '<div class="panel row" style="justify-content:space-between"><div><h3>Последний результат сохранён</h3><p class="muted">'+esc(saved.name)+'</p></div><button class="btn btn-ghost" id="showlast">Открыть отчёт</button></div>' : '';
  app.innerHTML =
   '<section class="stack" style="gap:14px"><span class="eyebrow">Диагностика по математике · '+selGrade+' класс</span>'+
   '<h1>'+lead(selGrade)+'</h1>'+
   '<p class="muted" style="max-width:62ch">Тест подстраивается под ответы. Решил сложную задачу — темы, на которых она держится, засчитываются сами. Ошибся — спускаемся к базовым темам и находим, где именно пробел. '+estimate(selGrade,selFull)+'</p></section>'+
   resume + lastReport +
   '<form class="panel stack" id="startform" novalidate>'+
     '<fieldset class="stack" style="border:0;margin:0;padding:0;gap:6px"><legend class="field" style="font-size:14px;font-weight:700;color:var(--muted);padding:0;margin-bottom:6px">Класс</legend><div class="row">'+
       GRADE_LIST.map(function(g){ return '<label class="gradepick"><input type="radio" name="grade" id="grade'+g+'" value="'+g+'"'+(g===selGrade?' checked':'')+'> '+g+'</label>'; }).join("")+
     '</div></fieldset>'+
     '<label class="fullpick" for="full"><input type="checkbox" id="full"'+(selFull?' checked':'')+'><span><b>Полная проверка</b><br><span class="muted">Задача по каждой теме, без автозачёта. Дольше, но видно каждую тему отдельно.</span></span></label>'+
     '<label class="field" for="name">Имя и фамилия<input type="text" id="name" autocomplete="name" placeholder="Например, Аружан Серикова" required></label>'+
     '<p id="nameerr" class="muted" hidden style="color:var(--gap-fg)">Напиши имя, чтобы оно стояло в отчёте.</p>'+
     '<ul class="rules"><li>Без калькулятора, с черновиком.</li><li>Не угадывай: если не знаешь, нажми «Не знаю». Так отчёт будет точнее.</li><li>Правильные ответы и разбор покажем в конце.</li></ul>'+
     '<div class="row"><button class="btn btn-primary" type="submit">Начать диагностику</button></div>'+
   '</form>'+
   '<section class="panel stack"><h2>Что проверяем</h2><p class="muted">'+A.length+' тем по школьной программе Казахстана'+(selGrade>4?' — с 4 по '+selGrade+' класс':'')+'.</p>'+
     '<div class="legend">'+GRADE_LIST.filter(function(g){return g<=selGrade;}).map(function(g){ return '<span class="chip c-assumed">'+g+' кл. · '+A.filter(function(t){return t.g===g;}).length+'</span>'; }).join("")+'</div><div class="map">'+
     SECTIONS.map(function(s){ var n=A.filter(function(t){return t.s===s.id;}).length; return n?'<div><span>'+s.name+'</span><b>'+n+'</b></div>':''; }).join("")+
   '</div></section>';
  document.getElementById("startform").addEventListener("submit",function(e){
    e.preventDefault(); var n=document.getElementById("name").value.trim();
    if(!n){ document.getElementById("nameerr").hidden=false; return; }
    S=newState(n,selGrade,selFull); advance();
  });
  [].slice.call(app.querySelectorAll('input[name=grade]')).forEach(function(r){ r.onchange=function(){
    var nm=document.getElementById("name").value; selGrade=+r.value; renderStart();
    document.getElementById("name").value=nm; document.getElementById("grade"+selGrade).focus(); }; });
  document.getElementById("full").onchange=function(e){ var nm=document.getElementById("name").value; selFull=e.target.checked; renderStart(); document.getElementById("name").value=nm; document.getElementById("full").focus(); };
  var r=document.getElementById("resume"); if(r) r.onclick=function(){ S=saved; S.cur.t=Date.now(); render(); };
  var l=document.getElementById("showlast"); if(l) l.onclick=function(){ S=saved; render(); };

function renderQuestion(){
  var c=S.cur, t=byId[c.id], q=t.q[c.qi], keys=["А","Б","В","Г"];
  var NT=act(S.grade).length, resolved=Object.keys(S.status).length, pct=Math.round(resolved/NT*100);
  var sec=SECTIONS[secIndex[t.s]];
  app.innerHTML =
   '<section class="stack" style="gap:8px"><div class="qhead"><span>'+sec.name+'</span><span>Вопрос '+(S.answers.length+1)+'</span></div>'+
   '<div class="bar" role="progressbar" aria-label="Проверено тем" aria-valuemin="0" aria-valuemax="'+NT+'" aria-valuenow="'+resolved+'"><i style="width:'+pct+'%"></i></div>'+
   '<p class="muted" style="font-size:13px">Проверено тем: '+resolved+' из '+NT+'</p></section>'+
   '<section class="panel stack" style="gap:18px">'+
     (c.qi===1?'<span class="eyebrow" style="color:var(--warn-fg)">Ещё одна задача на ту же тему</span>':'')+
     '<div class="qtext" id="qtext">'+q[0]+'</div>'+
     '<div class="opts" role="group" aria-labelledby="qtext">'+
       c.order.map(function(oi,k){ return '<button type="button" class="opt" data-o="'+oi+'" aria-pressed="false"><span class="k">'+keys[k]+'</span><span>'+q[1][oi]+'</span></button>'; }).join("")+
     '</div>'+
     '<div class="row" style="justify-content:space-between"><button type="button" class="btn btn-ghost" id="idk">Не знаю</button><button type="button" class="btn btn-primary" id="go" disabled>Ответить</button></div>'+
   '</section>'+
   '<p class="muted" style="font-size:13px">Можно отвечать с клавиатуры: 1–4 и Enter. Прогресс сохраняется в этом браузере.</p>';
  var picked=null, go=document.getElementById("go");
  var opts=[].slice.call(app.querySelectorAll(".opt"));
  function pick(btn){ opts.forEach(function(b){b.setAttribute("aria-pressed", b===btn?"true":"false");}); picked=+btn.dataset.o; go.disabled=false; }
  opts.forEach(function(b){ b.onclick=function(){ pick(b); }; });
  go.onclick=function(){ if(picked!==null){ detach(); answer(picked); } };
  document.getElementById("idk").onclick=function(){ detach(); answer(-1); };
  function onKey(e){
    if(e.target && e.target.tagName==="INPUT") return;
    var n=parseInt(e.key,10); if(n>=1&&n<=4){ pick(opts[n-1]); opts[n-1].focus(); }
    if(e.key==="Enter" && picked!==null && document.activeElement!==go){ e.preventDefault(); detach(); answer(picked); }
  }
  function detach(){ document.removeEventListener("keydown",onKey); }
  document.addEventListener("keydown",onKey);
  window.scrollTo(0,0);
}

function pl(n,a,b,c){ var m=Math.abs(n)%100, d=m%10; if(m>10&&m<20) return c; if(d>1&&d<5) return b; if(d===1) return a; return c; }
function analyze(){
  var A=act(S.grade), dep={}, st=S.status;
  A.forEach(function(t){ t.r.forEach(function(p){ (dep[p]=dep[p]||[]).push(t.id); }); });
  var gaps=A.filter(function(t){return st[t.id]==="gap";});
  var roots=gaps.filter(function(t){ return !t.r.some(function(p){ return st[p]==="gap"; }); }).sort(function(a,b){return a.g-b.g||a.i-b.i;});
  var isRoot={}; roots.forEach(function(t){ isRoot[t.id]=true; });
  function downstream(id){ var seen={}, out=[], q=[id];
    while(q.length){ var x=q.shift(); (dep[x]||[]).forEach(function(y){ if(!seen[y]){ seen[y]=1; q.push(y); if(st[y]==="gap"||st[y]==="unstable") out.push(byId[y]); } }); }
    return out.sort(function(a,b){return a.g-b.g||a.i-b.i;}); }
  return {A:A, gaps:gaps, roots:roots, isRoot:isRoot, downstream:downstream};
}
function cellKind(t,an){ var s=S.status[t.id]; if(s==="gap") return an.isRoot[t.id]?"root":"gap"; return s; }
var RANK={root:5,gap:4,unstable:3,mastered:2,assumed:1};
var KLABEL={root:"Корень пробела",gap:"Пробел",unstable:"Нестабильно",mastered:"Освоено (проверено)",assumed:"Освоено (по выводу)"};
var KICON={root:"!",gap:"!",unstable:"≈",mastered:"✓",assumed:""};
var selLine=null;

function counts(){
  var c={gap:0,unstable:0,mastered:0,assumed:0}; act(S.grade).forEach(function(t){ c[S.status[t.id]]++; }); return c;
}
function summaryText(){
  var c=counts(), an=analyze(), lines=[];
  lines.push("allΣath · Диагностика "+S.grade+" класс");
  lines.push("Ученик: "+S.name);
  lines.push("Тем: "+an.A.length+" · освоено: "+(c.mastered+c.assumed)+" · пробелы: "+c.gap+" · нестабильно: "+c.unstable);
  lines.push("Вопросов: "+S.answers.length+" · время: "+fmtTime(S.finished-S.started));
  if(an.roots.length){ lines.push(""); lines.push("Корни пробелов:"); an.roots.forEach(function(t){ lines.push("— "+t.n+" ("+t.g+" кл.)"); }); }
  var other=an.gaps.filter(function(t){return !an.isRoot[t.id];}).sort(function(a,b){return a.g-b.g;});
  if(other.length){ lines.push(""); lines.push("Пробелы, которые тянутся за корнями:"); other.forEach(function(t){ lines.push("— "+t.n+" ("+t.g+" кл.)"); }); }
  var uns=an.A.filter(function(t){return S.status[t.id]==="unstable";});
  if(uns.length){ lines.push(""); lines.push("Нестабильно:"); uns.forEach(function(t){ lines.push("— "+t.n+" ("+t.g+" кл.)"); }); }
  return lines.join("\n");
}

function owlSvg(){
  return '<svg class="owl" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 18 L20 8 L26 16 Q32 13 38 16 L44 8 L50 18 Q56 30 52 44 Q46 58 32 58 Q18 58 12 44 Q8 30 14 18Z" fill="#3B4C8C"/>'+
   '<path d="M20 44 Q32 54 44 44 Q42 52 32 54 Q22 52 20 44Z" fill="#5A6CB0"/>'+
   '<circle cx="24" cy="30" r="9" fill="#FFFFFF"/><circle cx="40" cy="30" r="9" fill="#FFFFFF"/>'+
   '<circle cx="24" cy="30" r="9" fill="none" stroke="#E8A33D" stroke-width="2.5"/><circle cx="40" cy="30" r="9" fill="none" stroke="#E8A33D" stroke-width="2.5"/><path d="M33 30 L31 30" stroke="#E8A33D" stroke-width="2.5"/>'+
   '<circle cx="25" cy="31" r="3.6" fill="#0F1B3D"/><circle cx="41" cy="31" r="3.6" fill="#0F1B3D"/><circle cx="26.2" cy="29.8" r="1.2" fill="#FFFFFF"/><circle cx="42.2" cy="29.8" r="1.2" fill="#FFFFFF"/>'+
   '<path d="M29.5 38 L34.5 38 L32 42Z" fill="#E8A33D"/></svg>';
}

function renderReport(){
  var c=counts(), an=analyze(), A=an.A, G=S.grade, grades=[];
  for(var g=4; g<=G; g++) grades.push(g);
  var date=new Date(S.finished).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
  var lines=SECTIONS.filter(function(s){ return A.some(function(t){return t.s===s.id;}); });
  if(!selLine || !lines.some(function(l){return l.id===selLine;})){
    var withRoot=an.roots.length ? an.roots[0].s : null;
    var withGap=lines.filter(function(l){ return A.some(function(t){return t.s===l.id && S.status[t.id]==="gap";}); })[0];
    selLine = withRoot || (withGap&&withGap.id) || lines[0].id;
  }

  // --- conclusion
  var nG=c.gap, nR=an.roots.length, head, sub;
  if(!nG && !c.unstable){ head="Пробелов не найдено"; sub=nextText(G); }
  else if(!nG){ head="Пробелов нет, но "+c.unstable+" "+pl(c.unstable,"тема","темы","тем")+" нестабильно"; sub="Это темы, где одну задачу решил, а вторую нет. Хватит короткой практики."; }
  else if(nR<nG){ head=nG+" "+pl(nG,"пробел","пробела","пробелов")+", но "+pl(nR,"корень","корня","корней")+" у них всего "+nR; var rn=an.roots.slice(0,3).map(function(t){return "«"+t.n+"»";}); sub="Закрой "+(rn.length>1?rn.slice(0,-1).join(", ")+" и "+rn[rn.length-1]:rn[0])+" — остальные темы подтянутся за "+(nR===1?"ней":"ними")+"."; }
  else { head=nG+" "+pl(nG,"пробел","пробела","пробелов"); sub="Пробелы не связаны между собой. Начни с самой ранней темы — «"+an.roots[0].n+"» ("+an.roots[0].g+" кл.)."; }

  // --- map
  var mapHead='<div class="mrow mhead"><span class="mname">Линия</span>'+grades.map(function(g){return '<span class="mg">'+g+' кл</span>';}).join("")+'<span class="msum">Итог</span></div>';
  var mapRows=lines.map(function(l){
    var lt=A.filter(function(t){return t.s===l.id;});
    var cells=grades.map(function(g){
      var ts=lt.filter(function(t){return t.g===g;});
      if(!ts.length) return '<span class="cell k-none" aria-hidden="true"></span>';
      var k=ts.map(function(t){return cellKind(t,an);}).sort(function(a,b){return RANK[b]-RANK[a];})[0];
      var tip=ts.map(function(t){return t.n+" — "+KLABEL[cellKind(t,an)];}).join("\n");
      return '<span class="cell k-'+k+'" title="'+esc(tip)+'">'+KICON[k]+(ts.length>1?'<i>'+ts.length+'</i>':'')+'</span>';
    }).join("");
    var bad=lt.filter(function(t){ var s=S.status[t.id]; return s==="gap"||s==="unstable"; }).sort(function(a,b){return a.g-b.g;});
    var sum, cls;
    if(!bad.length){ sum="всё освоено"; cls="ok"; }
    else { var lo=bad[0].g; var anyGap=bad.some(function(t){return S.status[t.id]==="gap";});
      sum = lo>4 && lt.some(function(t){return t.g<lo;}) ? "до "+(lo-1)+" кл" : "с "+lo+" кл"; cls=anyGap?"bad":"warn"; }
    return '<button type="button" class="mrow'+(l.id===selLine?' sel':'')+'" data-line="'+l.id+'" aria-pressed="'+(l.id===selLine)+'"><span class="mname">'+l.name+'</span>'+cells+'<span class="msum s-'+cls+'">'+sum+'</span></button>';
  }).join("");

  // --- line detail
  var cur=SECTIONS[secIndex[selLine]], lt=A.filter(function(t){return t.s===selLine;}).sort(function(a,b){return a.g-b.g||a.i-b.i;});
  var detail='<span class="eyebrow muted">Линия</span><h3>'+cur.name+'</h3><div class="tlist">'+lt.map(function(t){ var k=cellKind(t,an);
    return '<div class="titem k-'+k+'-row"><span class="cell sm k-'+k+'">'+KICON[k]+'</span><div><b>'+t.n+'</b><span class="muted">'+t.g+' кл · '+KLABEL[k]+'</span></div></div>'; }).join("")+'</div>';

  // --- roots
  var rootsHtml = an.roots.map(function(t,i){ var ds=an.downstream(t.id);
    var why = ds.length ? "Тянет за собой "+ds.length+" "+pl(ds.length,"тему","темы","тем")+": "+ds.slice(0,4).map(function(x){return x.n.toLowerCase();}).join("; ")+(ds.length>4?"…":"")+"." : "Базовая тема: из-за неё ошибки в задачах этой линии.";
    return '<div class="rootcard"><div class="row" style="gap:10px;flex-wrap:nowrap"><span class="num">'+(i+1)+'</span><h3>'+t.n+' · '+t.g+' кл</h3></div><p class="muted">'+why+'</p><a class="btn btn-primary sm" href="#errors">Разбор задач по теме</a></div>';
  }).join("");

  // --- 4-week plan
  var todo=an.A.filter(function(t){ var s=S.status[t.id]; return s==="gap"||s==="unstable"; })
    .sort(function(a,b){ return a.g-b.g || ((an.isRoot[b.id]?1:0)-(an.isRoot[a.id]?1:0)) || a.i-b.i; });
  var per=Math.max(1,Math.ceil(todo.length/4)), weeks=[];
  for(var w=0; w<4 && w*per<todo.length; w++) weeks.push(todo.slice(w*per,(w+1)*per));
  var planHtml = weeks.length ? '<section class="panel stack"><h2>План на '+weeks.length+' '+pl(weeks.length,"неделю","недели","недель")+'</h2><div class="weeks">'+
    weeks.map(function(ws,i){ return '<div class="week"><span class="num">'+(i+1)+'</span><div><b>Неделя '+(i+1)+'</b><ul>'+ws.map(function(t){ return '<li>'+t.n+' <span class="muted">· '+t.g+' кл'+(S.status[t.id]==="unstable"?" · закрепить":"")+'</span></li>'; }).join("")+'</ul></div></div>'; }).join("")+
    '</div></section>' : '';

  // --- errors
  var wrong=S.answers.filter(function(a){return !a.ok;});
  var wrongHtml = wrong.length ? wrong.map(function(a){ var t=byId[a.id], q=t.q[a.qi];
    return '<details><summary>'+t.n+' <span class="muted">· '+t.g+' кл</span></summary><div class="sol"><div>'+q[0]+'</div>'+
      '<div><span class="muted">Твой ответ:</span> '+(a.choice===-1?"не знаю":q[1][a.choice])+'</div>'+
      '<div><span class="muted">Верно:</span> <b>'+q[1][0]+'</b></div><div class="muted">'+q[2]+'</div></div></details>'; }).join("") : '<p class="muted">Ошибок нет.</p>';

  app.className="wide";
  app.innerHTML =
   '<section class="rhead"><div class="stack" style="gap:4px"><h1 class="rtitle">Результаты диагностики</h1><p class="muted">'+esc(S.name)+' · '+G+' класс · '+date+' · '+S.answers.length+' '+pl(S.answers.length,"задача","задачи","задач")+' · '+fmtTime(S.finished-S.started)+'</p></div>'+
     '<div class="row"><a class="btn btn-ghost sm" href="#send">Отчёт для родителя</a><button class="btn btn-ghost sm" id="restart">Пройти заново</button><button class="btn btn-primary sm" id="restart2" hidden>Да, начать заново</button></div></section>'+
   '<section class="toprow"><div class="hero"><div class="owlwrap">'+owlSvg()+'</div><div class="stack" style="gap:6px"><span class="eyebrow" style="color:var(--hero-eyebrow)">Главный вывод</span><h2>'+head+'</h2><p>'+sub+'</p></div></div>'+
     '<div class="kpis">'+
       '<div class="kpi"><span>Тем в зоне проверки</span><b>'+A.length+'</b><small>'+(G>4?'4–'+G+' кл':'4 кл')+'</small></div>'+
       '<div class="kpi"><span>Освоено</span><b>'+(c.mastered+c.assumed)+'</b><small>'+c.mastered+' проверено, '+c.assumed+' по выводу</small></div>'+
       '<div class="kpi"><span>Пробелы</span><b class="'+(c.gap?'tbad':'')+'">'+c.gap+'</b><small>'+(c.unstable?'и '+c.unstable+' нестабильно':'нестабильных нет')+'</small></div>'+
       '<div class="kpi"><span>Корни пробелов</span><b class="'+(nR?'tbad':'')+'">'+nR+'</b><small>'+(nR?'с них начинаем':'—')+'</small></div>'+
     '</div></section>'+
   '<section class="mainrow"><div class="panel stack mapbox"><div class="row" style="justify-content:space-between"><h2>Карта знаний</h2><span class="muted" style="font-size:13px">Нажми на линию, чтобы увидеть её темы</span></div>'+
       '<div class="legend">'+["mastered","assumed","unstable","gap","root"].map(function(k){ return '<span class="lg"><span class="cell xs k-'+k+'">'+KICON[k]+'</span>'+KLABEL[k].replace(" (проверено)"," (проверено)")+'</span>'; }).join("")+'</div>'+
       '<div class="mapscroll"><div class="map2" style="--cols:'+grades.length+'">'+mapHead+mapRows+'</div></div></div>'+
     '<div class="side"><div class="panel stack" id="linedetail">'+detail+'</div>'+
       (an.roots.length?'<div class="panel stack"><h2>Начни с корней</h2>'+rootsHtml+'</div>':'')+
     '</div></section>'+
   planHtml+
   '<section class="panel stack" id="errors"><h2>Разбор ошибок</h2>'+wrongHtml+'</section>'+
   '<section class="panel stack" id="send"><h2>Отправить результат</h2>'+
     '<p class="muted">Отправь отчёт Алмас ағай в WhatsApp: +7 708 199 57 18</p>'+
     '<div class="row"><a class="btn btn-gold" target="_blank" rel="noopener" href="https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(summaryText())+'">Открыть WhatsApp</a>'+
     '<button class="btn btn-ghost" id="copy">Скопировать текст</button></div>'+
     '<p id="copied" class="muted" hidden>Скопировано.</p><textarea class="copyfall" id="copyfall" hidden readonly></textarea>'+
   '</section>';

  [].slice.call(app.querySelectorAll(".mrow[data-line]")).forEach(function(b){ b.onclick=function(){ selLine=b.dataset.line; var y=window.scrollY; renderReport(); window.scrollTo(0,y); var d=document.getElementById("linedetail"); if(window.innerWidth<900 && d) d.scrollIntoView({block:"nearest"}); }; });
  document.getElementById("copy").onclick=function(){
    var txt=summaryText(), ok=document.getElementById("copied"), fb=document.getElementById("copyfall");
    function fallback(){ fb.hidden=false; fb.value=txt; fb.focus(); fb.select(); }
    try{ navigator.clipboard.writeText(txt).then(function(){ ok.hidden=false; }, fallback); }catch(e){ fallback(); }
  };
  document.getElementById("restart").onclick=function(){ document.getElementById("restart2").hidden=false; };
  document.getElementById("restart2").onclick=function(){ clear(); S=null; selLine=null; render(); window.scrollTo(0,0); };
}

render();
})();
</script>
</body>
